name: build-and-push-gpu-test-image

# Builds docker/ (SGLang 0.5.10 + Antarctic penguins_v2 + harness venv)
# on GitHub's amd64 runners and pushes to Docker Hub.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     a Docker Hub access token (hub.docker.com ->
#                       Account Settings -> Personal access tokens -> RW)
#
# Then trigger from the Actions tab ("Run workflow"), or push any change
# under docker/ on the phase2 branch.

on:
  workflow_dispatch:
  push:
    branches: [phase2/aug5-evaluator-and-deoverlap-fix]
    paths: ["docker/**"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk (the SGLang base image is large)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tpc2026-penguins-v2test:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tpc2026-penguins-v2test:v2

      - name: Image digest note
        run: echo "Pushed ${{ secrets.DOCKERHUB_USERNAME }}/tpc2026-penguins-v2test (latest, v2)"
