# TPC 2026 Phase-2 GPU test — two containers, one command.
#   MODEL_DIR=/data/models/Qwen3.6-27B docker compose up --abort-on-container-exit harness
# Serving = OFFICIAL SGLang image (organizer stack, unmodified).
# Harness shares the server's network namespace so the package's hardcoded
# 127.0.0.1:30000 works with zero config overrides.

services:
  sglang:
    image: lmsysorg/sglang:v0.5.10.post1
    command: >
      python3 -m sglang.launch_server
      --model-path /models/Qwen3.6-27B
      --served-model-name Qwen3.6-27B
      --host 0.0.0.0 --port 30000
      --tp ${TP:-2}
    volumes:
      - ${MODEL_DIR:-/data/models/Qwen3.6-27B}:/models/Qwen3.6-27B:ro
    shm_size: "32gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  harness:
    image: zhanggangyi1224/tpc2026-penguins-v2test:latest
    network_mode: "service:sglang"
    depends_on:
      - sglang
    volumes:
      - ./out:/output
